[package]
name = "hyprland-preview-share-picker"
version = "0.1.0"
edition = "2024"
description = "An alternative share picker for hyprland with window and monitor previews"

[dependencies]
chrono = "0.4.39"
clap = { version = "4.5.28", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.6"
glib = "0.20.7"
gtk4 = { version = "0.9.5", features = ["v4_8"] }
gtk4-layer-shell = "0.4.0"
hyprland-preview-share-picker-lib = { path = "./lib" }
image = "0.25.5"
log = "0.4.25"
regex = "1.11.1"
rsass = "0.29.0"
schemars = "0.8.21"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
serde_yaml = "0.9.34"
shlex = "1.3.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "sync", "macros"] }
wayland-client = "0.31.8"
